# Kav+: once a week, checks whether upstream Kav (ImNoammm/kav) has a release this fork hasn't merged,
# and opens an issue with its notes so it isn't missed (Moovit fixes come from there).
name: Upstream

on:
  schedule:
    - cron: "0 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read
  issues: write

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Compare with upstream's latest release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$(gh api repos/ImNoammm/kav/releases/latest --jq .tag_name)
          git fetch --quiet https://github.com/ImNoammm/kav.git "refs/tags/$tag:refs/tags/upstream-$tag"
          if git merge-base --is-ancestor "upstream-$tag" HEAD; then
            echo "Already have upstream $tag."; exit 0
          fi
          title="Upstream Kav $tag is out"
          if gh issue list --state all --search "\"$title\" in:title" --json number --jq 'length' | grep -qv '^0$'; then
            echo "Issue for $tag already exists."; exit 0
          fi
          notes=$(gh api "repos/ImNoammm/kav/releases/tags/$tag" --jq .body)
          {
            echo "Upstream Kav published **$tag**: https://github.com/ImNoammm/kav/releases/tag/$tag"
            echo
            echo "To bring it into Kav+:"
            echo '```sh'
            echo "git fetch upstream --tags && git merge $tag"
            echo '```'
            echo "Then bump versionCode/versionName in android/app/build.gradle.kts (\`<upstream>.p1\`, code = upstream × 100 + 1), rebuild with the Kav+ key and release."
            echo
            echo "---"
            echo
            echo "$notes"
          } > body.md
          gh issue create --title "$title" --body-file body.md
